<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gather '26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="topo-bg" aria-hidden="true"></div>
    <main class="app-shell">
      <header class="app-header">
        <h1 id="app-title">Gather '26</h1>
        <div class="subtitle-area">
          <p id="app-subtitle" class="subtitle"></p>
          <a id="map-link" class="map-link" href="#" target="_blank"></a>
        </div>
        <a id="whatsapp-link-header" class="whatsapp-link whatsapp-header" href="#" target="_blank" title="WhatsApp">
          <img src="./assets/whatsapp-glyph-green.svg" alt="WhatsApp" width="28" height="28" style="display: block;"/>
        </a>
      </header>

      <section id="status-strip" class="status-strip" aria-live="polite"></section>

      <nav class="nav-tabs">
        <button class="nav-tab is-active" data-view="schedule">Schedule</button>
        <button class="nav-tab" data-view="assignments">Assignments</button>
        <button class="nav-tab" data-view="food">Food</button>
      </nav>

      <section id="skeleton" class="skeleton-accordion" aria-label="Loading content">
        <div class="skeleton-day"></div>
        <div class="skeleton-day"></div>
        <div class="skeleton-day"></div>
        <div class="skeleton-day"></div>
        <div class="skeleton-day"></div>
      </section>

      <section id="content" class="content hidden">
        <!-- Schedule View -->
        <div id="view-schedule" class="view">
          <div id="accordion-root" class="accordion"></div>
        </div>

        <!-- Assignments View -->
        <div id="view-assignments" class="view hidden">
          <div class="search-box">
            <input type="text" id="assignment-search" placeholder="Search by name, assignment, or day..." />
          </div>
          <div id="assignments-list" class="assignments-list"></div>
        </div>

        <!-- Food View -->
        <div id="view-food" class="view hidden">
          <div id="food-content"></div>
        </div>
      </section>

      <footer class="app-footer">
        <a id="whatsapp-link-footer" class="whatsapp-link whatsapp-footer" href="#" target="_blank" title="WhatsApp">
          <img src="./assets/whatsapp-glyph-green.svg" alt="WhatsApp" width="40" height="40" style="display: block;"/>
        </a>
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
